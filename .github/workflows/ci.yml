name: CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.32
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-start-period=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Wait for MySQL and create database
        run: |
          until mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SELECT 1"; do
            echo "Waiting for MySQL to be ready..."
            sleep 3
          done
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "CREATE DATABASE IF NOT EXISTS testdb;"  # Create testdb

      - name: Build and test with Gradle
        run: ./gradlew build --info

        env:
          MYSQL_URL: "jdbc:mysql://localhost:3306/testdb"
          MYSQL_USER: "root"
          MYSQL_PASSWORD: "root"

      - name: Run unit tests
        run: ./gradlew test --info

        env:
          MYSQL_URL: "jdbc:mysql://localhost:3306/testdb"
          MYSQL_USER: "root"
          MYSQL_PASSWORD: "root"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: build/libs/

      - name: Deploy .jar file to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Automatically provided by GitHub Actions
        run: |
          # Path to the generated .jar file
          JAR_FILE="build/libs/MyApp-1.0.0.jar"
          
          # Create a new GitHub release and upload the .jar file as an asset
          gh release create v1.0.0 $JAR_FILE --title "MyApp v1.0.0" --notes "First release of MyApp."

      - name: Clean up
        run: |
          echo "Cleaning up..."
          docker ps -a
          docker stop $(docker ps -q)
          docker rm $(docker ps -a -q)
